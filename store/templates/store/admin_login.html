<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickNShop Admin Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;font-family:Arial,sans-serif;color:#222;padding:20px}
.panel{width:100%;max-width:420px;background:#fff;border-radius:16px;box-shadow:0 12px 40px #17255418;overflow:hidden}
header{background:#ff5722;color:#fff;padding:25px 28px}header h1{margin:0;font-size:25px}header p{margin:8px 0 0;opacity:.9}
form{padding:28px}label{display:block;margin:0 0 8px;font-weight:600}input{width:100%;padding:13px 14px;border:1px solid #ccd2dc;border-radius:8px;margin-bottom:18px;font-size:16px}button{width:100%;border:0;border-radius:8px;background:#ff5722;color:#fff;font-size:16px;font-weight:700;padding:14px;cursor:pointer}button:hover{background:#e94b18}.error{background:#fff0ed;color:#a12612;padding:12px;border-radius:8px;margin-bottom:18px;font-size:14px}.hint{text-align:center;color:#687386;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="panel">
<header><h1>ClickNShop Admin</h1><p>Sign in to manage products and orders</p></header>
<form method="post">
{% csrf_token %}
<input type="hidden" name="next" value="{{ next }}">
{% if messages %}{% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}{% endif %}
<label for="username">Admin username</label>
<input id="username" name="username" type="text" autocomplete="username" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
<p class="hint">Staff accounts only. Customer accounts cannot access this dashboard.</p>
</form>
</div>
</body>
</html>
